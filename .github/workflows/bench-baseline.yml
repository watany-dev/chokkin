name: Bench baseline

# Saves main's criterion baseline for the bench gate in verification.yml
# (#836), so a PR benchmarks only its head instead of its base and its head
# back to back. The cache key (scripts/bench-baseline-key.sh) covers the trees
# that can move a benchmark and the toolchain; a PR whose base has no saved
# baseline benchmarks the base itself, as before.

on:
  push:
    branches: [main]
    paths:
      - src/**
      - benches/**
      - Cargo.toml
      - Cargo.lock
      - Makefile
      - scripts/bench-baseline-key.sh
      - .github/workflows/bench-baseline.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  baseline:
    name: Bench baseline (main)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Cache key
        id: key
        run: echo "key=$(scripts/bench-baseline-key.sh HEAD)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: lookup
        with:
          path: target/criterion
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.lookup.outputs.cache-hit != 'true'
      - name: Benchmark main
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          rm -rf target/criterion
          make bench-save BASELINE=base
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.lookup.outputs.cache-hit != 'true'
        with:
          path: target/criterion
          key: ${{ steps.key.outputs.key }}
