name: Verification

# Test-effectiveness checks (#418, #837). A missed mutant fails the run: on a
# PR only the mutants on lines the PR changes, weekly all of `make mutants`.
# Both split into shards of about 100 mutants so a large diff still finishes
# within a job timeout. kani runs on demand or weekly. On PRs the benchmark
# regression gate (#836) also runs, but only reports: it never fails the PR.

on:
  # No paths filter: `Mutants` is meant to be a required check, and a PR without
  # Rust changes passes it with zero mutants instead of leaving it pending.
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      full-mutants:
        description: "Run cargo-mutants over everything `make mutants` covers"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  MUTANTS_TARGET: ${{ github.event_name == 'pull_request' && 'mutants-diff' || 'mutants' }}
  BASE: origin/${{ github.base_ref }}

jobs:
  mutants-plan:
    name: Mutants (plan)
    if: github.event_name != 'workflow_dispatch' || inputs.full-mutants
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      # `--list` only parses the source, so the runner's preinstalled cargo is enough.
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-mutants@27.1.0
      - name: Count mutants and pick the shard count
        id: plan
        # About 100 mutants per shard (~20 min at -j 2), at most 8 shards.
        run: |
          mkdir -p target
          make -s "$MUTANTS_TARGET" ARGS=--list > target/mutants-list.txt
          count=$(grep -c . target/mutants-list.txt || true)
          shards=$(( (count + 99) / 100 ))
          if [ "$shards" -lt 1 ]; then shards=1; fi
          if [ "$shards" -gt 8 ]; then shards=8; fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "shards=$(jq -cn --argjson n "$shards" '[range($n)]')" >> "$GITHUB_OUTPUT"
          echo "$count mutants, $shards shard(s)" >> "$GITHUB_STEP_SUMMARY"

  mutants:
    name: Mutants (shard ${{ matrix.shard }})
    needs: mutants-plan
    if: needs.mutants-plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutants-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-mutants@27.1.0
      - name: Mutate
        id: mutate
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        # Exit 2 (missed) and 3 (timeout) are left to the next step: a timeout
        # counts as caught, and exit 3 hides missed mutants in the same run.
        run: |
          status=0
          make "$MUTANTS_TARGET" ARGS="--shard $SHARD" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          case "$status" in 0 | 2 | 3) ;; *) exit "$status" ;; esac
      - name: Fail on missed mutants
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
          STATUS: ${{ steps.mutate.outputs.status }}
        run: |
          {
            echo "### cargo-mutants (shard $SHARD)"
            if [ -s mutants.out/missed.txt ]; then
              echo "Missed mutants: a test should have failed for each of these."
              echo "Add the test, or exclude an equivalent mutant in .cargo/mutants.toml."
              echo '```'
              cat mutants.out/missed.txt
              echo '```'
            elif [ "$STATUS" = 0 ] || [ "$STATUS" = 3 ]; then
              echo "No missed mutants."
            else
              echo "cargo-mutants did not finish (exit ${STATUS:-none}); see the Mutate step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          test ! -s mutants.out/missed.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants-${{ matrix.shard }}
          path: mutants.out
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}

  bench-gate:
    # Non-blocking until a few weeks of results show how noisy the runners are
    # and whether --threshold needs tuning (#836).
    name: Bench gate (PR vs base, non-blocking)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # HEAD is the PR merge commit; HEAD^1 is the base it was merged onto.
          fetch-depth: 2
      - name: Check for changes that can move a benchmark
        id: changes
        run: |
          # Changes to the gate itself run it too, as an A/A check of the job.
          if git diff --quiet HEAD^1 HEAD -- src benches Cargo.toml Cargo.lock \
            scripts/bench-gate.py .github/workflows/verification.yml; then
            echo "No change that can move a benchmark; skipped." >>"$GITHUB_STEP_SUMMARY"
            echo "run=false" >>"$GITHUB_OUTPUT"
          else
            echo "run=true" >>"$GITHUB_OUTPUT"
          fi
      - name: Install toolchain
        if: steps.changes.outputs.run == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.changes.outputs.run == 'true'
      - name: Benchmark base
        # Base and head run back to back on the same runner, so runner-to-runner
        # differences do not show up as a change. CRITERION_HOME puts the base
        # baseline where the head comparison looks for it. The target directory
        # must stay separate: both checkouts have the same package version, and
        # cargo would reuse the base build for head (release-validation.ja.md §1).
        if: steps.changes.outputs.run == 'true'
        run: |
          rm -rf target/criterion
          git worktree add "$RUNNER_TEMP/base" HEAD^1
          CARGO_TARGET_DIR="$RUNNER_TEMP/base-target" CRITERION_HOME="$PWD/target/criterion" \
            make -C "$RUNNER_TEMP/base" bench-save BASELINE=base
      - name: Compare head with base
        if: steps.changes.outputs.run == 'true'
        run: scripts/bench-gate.py --baseline base --confirm 3
      - name: Summarize
        if: always() && steps.changes.outputs.run == 'true'
        run: |
          if [ -f target/bench-gate/report.md ]; then
            cat target/bench-gate/report.md >>"$GITHUB_STEP_SUMMARY"
          else
            echo "Benchmark gate produced no report; see the job log." >>"$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.changes.outputs.run == 'true'
        with:
          name: bench-gate
          path: target/bench-gate
          if-no-files-found: ignore
          retention-days: 14

  # One stable check name for branch protection, whatever the shard count.
  mutants-result:
    name: Mutants
    needs: [mutants-plan, mutants]
    if: always() && needs.mutants-plan.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          PLAN: ${{ needs.mutants-plan.result }}
          SHARDS: ${{ needs.mutants.result }}
        run: |
          echo "plan: $PLAN, shards: $SHARDS"
          [ "$PLAN" = success ] && { [ "$SHARDS" = success ] || [ "$SHARDS" = skipped ]; }

  kani:
    name: Kani proofs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install kani
        run: |
          cargo install --locked kani-verifier@0.68.0
          cargo kani setup
      - run: make kani
