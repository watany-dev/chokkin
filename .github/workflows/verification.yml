name: Verification

# Test-effectiveness checks (#418, #837). A missed mutant fails the run: on a
# PR only the mutants on lines the PR changes and in files whose tests it cut
# (#1118), weekly one slice of `make mutants` (all of src/) in turn (#1123).
# Both split into shards (about 50 mutants on a PR, at most 100 weekly) so
# each finishes within a job timeout. kani runs on demand, weekly, and on PRs that change a
# file holding `#[cfg(kani)]` harnesses (#860). On PRs the benchmark
# regression gate (#836) also runs, but only reports: it never fails the PR.

on:
  # No paths filter: `Mutants` is meant to be a required check, and a PR without
  # Rust changes passes it with zero mutants instead of leaving it pending.
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      full-mutants:
        description: "Run this week's slice of `make mutants`"
        type: boolean
        default: false
      mutants-slice:
        description: "With full-mutants: run this slice (0-based) instead of this week's"
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  MUTANTS_TARGET: ${{ github.event_name == 'pull_request' && 'mutants-diff' || 'mutants' }}
  BASE: origin/${{ github.base_ref }}

jobs:
  mutants-plan:
    name: Mutants (plan)
    if: github.event_name != 'workflow_dispatch' || inputs.full-mutants
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
      total: ${{ steps.plan.outputs.total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      # `--list` only parses the source, so the runner's preinstalled cargo is enough.
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-mutants@27.1.0
      - name: Count mutants and pick the shards
        id: plan
        # A mutant takes about 40 s at -j 2 (incremental rebuild plus the
        # nextest run). A PR runs about 50 per shard, at most 12 shards, which
        # fit comfortably inside the 60-minute job timeout with the baseline
        # build on top. All of src/ is too much for 12 shards (#1123), so the
        # weekly run splits it into slices of 12 shards of at most 100 and runs
        # the slice the ISO week picks: every mutant runs once per round.
        env:
          SLICE: ${{ inputs.mutants-slice }}
        run: |
          mkdir -p target
          make -s "$MUTANTS_TARGET" ARGS=--list > target/mutants-list.txt
          count=$(grep -c . target/mutants-list.txt || true)
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            total=$(( (count + 49) / 50 ))
            if [ "$total" -lt 1 ]; then total=1; fi
            if [ "$total" -gt 12 ]; then total=12; fi
            slices=1
          else
            total=$(( (count + 99) / 100 ))
            if [ "$total" -lt 1 ]; then total=1; fi
            slices=$(( (total + 11) / 12 ))
            if [ "$slices" -gt 1 ]; then total=$(( slices * 12 )); fi
          fi
          slice=$(( ${SLICE:-$(( 10#$(date -u +%V) ))} % slices ))
          first=$(( slice * 12 ))
          run=$(( total < 12 ? total : 12 ))
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "shards=$(jq -cn --argjson a "$first" --argjson n "$run" '[range($a; $a + $n)]')" >> "$GITHUB_OUTPUT"
          if [ "$slices" -gt 1 ]; then
            echo "$count mutants in $slices weekly slices; slice $slice runs shards $first-$(( first + run - 1 )) of $total" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$count mutants, $total shard(s)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s target/mutants-widened.txt ]; then
            sed 's/^/- /' target/mutants-widened.txt >> "$GITHUB_STEP_SUMMARY"
          fi

  mutants:
    name: Mutants (shard ${{ matrix.shard }})
    needs: mutants-plan
    if: needs.mutants-plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutants-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # No rust-cache here: cargo-mutants builds in copies of the tree that
      # start without a target directory, so the cache never serves a mutant
      # build, and the action exports CARGO_INCREMENTAL=0, which turns every
      # mutant's rebuild into a full one. The Makefile sets CARGO_INCREMENTAL=1.
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.133
      - name: Mutate
        id: mutate
        env:
          SHARD: ${{ matrix.shard }}/${{ needs.mutants-plan.outputs.total }}
        # Exit 2 (missed) and 3 (timeout) are left to the next step: a timeout
        # counts as caught, and exit 3 hides missed mutants in the same run.
        # The timeout bounds time only: a mutant that allocates forever ran the
        # runner out of memory and lost the shard's results (#994, #1120).
        # Capping each process's data segment makes its test abort instead,
        # which counts as caught. 4 GiB clears a build and the whole suite
        # (1 GiB already fails a build), and two jobs of rustc plus a runaway
        # test or two stay inside the runner's 16 GB.
        run: |
          ulimit -d 4194304
          status=0
          make "$MUTANTS_TARGET" ARGS="--shard $SHARD" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          case "$status" in 0 | 2 | 3) ;; *) exit "$status" ;; esac
      - name: Fail on missed mutants
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
          STATUS: ${{ steps.mutate.outputs.status }}
        run: |
          {
            echo "### cargo-mutants (shard $SHARD)"
            if [ -s mutants.out/missed.txt ]; then
              echo "Missed mutants: a test should have failed for each of these."
              echo "Add the test, or exclude an equivalent mutant in .cargo/mutants.toml."
              echo '```'
              cat mutants.out/missed.txt
              echo '```'
            elif [ "$STATUS" = 0 ] || [ "$STATUS" = 3 ]; then
              echo "No missed mutants."
            else
              echo "cargo-mutants did not finish (exit ${STATUS:-none}); see the Mutate step."
            fi
            # A timeout counts as caught, but a mutant that only slows a test
            # down is a missed one in disguise: list them to be read.
            if [ -s mutants.out/timeout.txt ]; then
              echo "Timed out (counted as caught; check none is a slow missed one):"
              echo '```'
              cat mutants.out/timeout.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          test ! -s mutants.out/missed.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-${{ matrix.shard }}
          path: mutants.out
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}

  bench-gate:
    # Non-blocking until a few weeks of results show how noisy the runners are
    # and whether --threshold needs tuning (#836).
    name: Bench gate (PR vs base, non-blocking)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # HEAD is the PR merge commit; HEAD^1 is the base it was merged onto.
          fetch-depth: 2
      - name: Check for changes that can move a benchmark
        id: changes
        run: |
          # Changes to the gate itself run it too, as an A/A check of the job.
          if git diff --quiet HEAD^1 HEAD -- src benches Cargo.toml Cargo.lock \
            scripts/bench-gate.py .github/workflows/verification.yml; then
            echo "No change that can move a benchmark; skipped." >>"$GITHUB_STEP_SUMMARY"
            echo "run=false" >>"$GITHUB_OUTPUT"
          else
            echo "run=true" >>"$GITHUB_OUTPUT"
          fi
      - name: Install toolchain
        if: steps.changes.outputs.run == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.changes.outputs.run == 'true'
      - name: Benchmark base
        # Base and head run back to back on the same runner, so runner-to-runner
        # differences do not show up as a change. CRITERION_HOME puts the base
        # baseline where the head comparison looks for it. The target directory
        # must stay separate: both checkouts have the same package version, and
        # cargo would reuse the base build for head (release-validation.ja.md §1).
        if: steps.changes.outputs.run == 'true'
        run: |
          rm -rf target/criterion
          git worktree add "$RUNNER_TEMP/base" HEAD^1
          CARGO_TARGET_DIR="$RUNNER_TEMP/base-target" CRITERION_HOME="$PWD/target/criterion" \
            make -C "$RUNNER_TEMP/base" bench-save BASELINE=base
      - name: Compare head with base
        if: steps.changes.outputs.run == 'true'
        run: scripts/bench-gate.py --baseline base --confirm 3
      - name: Summarize
        if: always() && steps.changes.outputs.run == 'true'
        run: |
          if [ -f target/bench-gate/report.md ]; then
            cat target/bench-gate/report.md >>"$GITHUB_STEP_SUMMARY"
          else
            echo "Benchmark gate produced no report; see the job log." >>"$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.changes.outputs.run == 'true'
        with:
          name: bench-gate
          path: target/bench-gate
          if-no-files-found: ignore
          retention-days: 14

  # One stable check name for branch protection, whatever the shard count.
  mutants-result:
    name: Mutants
    needs: [mutants-plan, mutants]
    if: always() && needs.mutants-plan.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          PLAN: ${{ needs.mutants-plan.result }}
          SHARDS: ${{ needs.mutants.result }}
        run: |
          echo "plan: $PLAN, shards: $SHARDS"
          [ "$PLAN" = success ] && { [ "$SHARDS" = success ] || [ "$SHARDS" = skipped ]; }

  # A failed weekly or full run files its missed mutants as an issue (#1119):
  # the scheduled-workflow e-mail alone left #1117 on main for days. One open
  # issue collects every failed run, each as a comment.
  mutants-issue:
    name: Mutants (file missed on main)
    needs: [mutants-plan, mutants]
    if: >-
      always() && github.event_name != 'pull_request' &&
      contains(fromJSON('["failure", "cancelled"]'), needs.mutants.result)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write # gh issue create / comment
    steps:
      # A shard whose runner was lost uploads nothing; file the issue anyway.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: mutants-*
          path: shards
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "test: cargo-mutants found missed mutants on main"
        run: |
          missed=$(cat shards/*/missed.txt 2>/dev/null | sort -u || true)
          {
            echo "The [${GITHUB_EVENT_NAME} cargo-mutants run]($RUN_URL) failed on \`${GITHUB_SHA::7}\`."
            echo
            if [ -n "$missed" ]; then
              echo "Missed mutants: add the test, or exclude an equivalent mutant in \`.cargo/mutants.toml\`."
              echo
              echo '```'
              echo "$missed"
              echo '```'
            else
              echo "No shard reported a missed mutant: a shard did not finish (job timeout, runner lost, build failure). See the run."
            fi
          } > body.md
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file body.md
          fi

  kani:
    name: Kani proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # HEAD is the PR merge commit; HEAD^1 is the base it was merged onto.
          fetch-depth: ${{ github.event_name == 'pull_request' && '2' || '1' }}
      - name: Check for changes to a file with harnesses
        id: changes
        # A harness mostly checks the code in its own file, so a change there
        # is the likeliest to break a proof. A change elsewhere that a harness
        # calls into (`emit.rs` uses `filter.rs`) waits for the weekly run.
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t changed < <(git diff --name-only HEAD^1 HEAD -- src)
          if ! git diff --quiet HEAD^1 HEAD -- .github/workflows/verification.yml ||
            { [ "${#changed[@]}" -gt 0 ] &&
              { git grep -qF 'cfg(kani)' HEAD -- "${changed[@]}" ||
                git grep -qF 'cfg(kani)' HEAD^1 -- "${changed[@]}"; }; }; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "No change to a file with kani harnesses; skipped." >>"$GITHUB_STEP_SUMMARY"
            echo "run=false" >>"$GITHUB_OUTPUT"
          fi
      - name: Install toolchain
        if: steps.changes.outputs.run == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install kani
        if: steps.changes.outputs.run == 'true'
        run: |
          cargo install --locked kani-verifier@0.68.0
          cargo kani setup
      - if: steps.changes.outputs.run == 'true'
        run: make kani
