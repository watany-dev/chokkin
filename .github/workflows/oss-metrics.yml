name: OSS metrics

# v0.5 release gate (#325) and the before/after measurement for the R-01..R-07
# corpus (#323). Clones third-party projects and only reads them statically;
# nothing from the clones is executed.

# Runs on every change to the analysis (src/**, Cargo.lock) or the corpus
# tooling, on main and on pull requests, and weekly (#835). Not a required
# check: a red run on a PR is the §17 / corpus regression signal to review.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"
  push:
    branches: [main]
    paths:
      - src/**
      - Cargo.lock
      - .github/workflows/oss-metrics.yml
      - scripts/oss-*
      - scripts/oss_corpus.py
      - scripts/clone-oss-fixtures.sh
  pull_request:
    paths:
      - src/**
      - Cargo.lock
      - .github/workflows/oss-metrics.yml
      - scripts/oss-*
      - scripts/oss_corpus.py
      - scripts/clone-oss-fixtures.sh

# A pull request run is superseded by its next push; a main push or the weekly
# run is not cancelled by the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # v0.4.1 has no tag; this is "chore: prepare v0.4.1 release (#284)".
  BASELINE_REV: 573ff37

jobs:
  oss-metrics:
    name: OSS metrics (baseline vs HEAD)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: python -m pip install jsonschema==4.26.0
      - name: Build HEAD
        run: cargo build --release --locked --bin chokkin
      - name: Test HEAD
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - name: Build baseline
        run: |
          git worktree add "$RUNNER_TEMP/chokkin-baseline" "$BASELINE_REV"
          cargo build --release --locked --bin chokkin \
            --manifest-path "$RUNNER_TEMP/chokkin-baseline/Cargo.toml" \
            --target-dir target/baseline
      - name: Clone corpus
        run: scripts/clone-oss-fixtures.sh
      - name: Measure baseline
        run: scripts/oss-metrics.py -b target/baseline/release/chokkin -o target/oss-metrics-baseline
      - name: Measure HEAD
        # The gate verdict is recorded and enforced in the last step so the
        # report and artifacts are produced even when it fails. --baseline
        # adds the spec §17 Phase 4 CHK003 growth criterion to the gate.
        run: |
          status=0
          scripts/oss-metrics.py -o target/oss-metrics --baseline target/oss-metrics-baseline --gate || status=$?
          echo "$status" >target/oss-metrics/gate.status
      - name: Determinism / schema / crash gate
        # The 20 clones plus the recall sentinels; enforced in the last step.
        run: |
          status=0
          scripts/oss-gate.py || status=$?
          echo "$status" >target/oss-gate.status
      - name: Report
        # The full scorecard lists every finding and outgrows the job summary
        # limit, so it only goes to the artifact.
        run: |
          { echo "# Before/after (${BASELINE_REV} vs HEAD)"; echo ""; cat target/oss-metrics/compare.md; } |
            tee -a "$GITHUB_STEP_SUMMARY"
          if [ -f target/oss-gate/report.md ]; then
            { echo ""; cat target/oss-gate/report.md; } >>"$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: oss-metrics
          path: |
            target/oss-metrics/*.tsv
            target/oss-metrics/report.md
            target/oss-metrics/compare.md
            target/oss-metrics-baseline/*.tsv
            target/oss-metrics-baseline/report.md
            target/oss-clones/clones.lock.tsv
            target/oss-gate/summary.json
            target/oss-gate/report.md
          retention-days: 30
      - name: Release gate
        run: |
          echo "oss-metrics --gate: $(cat target/oss-metrics/gate.status), oss-gate: $(cat target/oss-gate.status)"
          test "$(cat target/oss-metrics/gate.status)" = 0
          test "$(cat target/oss-gate.status)" = 0
