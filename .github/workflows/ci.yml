name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily: catch newly published RustSec advisories without a code change.
    - cron: "0 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Short checks share one job to save runner slots and setup time.
  # Each check step runs even if an earlier one failed (`!cancelled()`).
  lint:
    name: Lint (fmt, clippy, doc, machete)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-machete@0.9.2
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo doc
        if: ${{ !cancelled() }}
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked
      - name: cargo machete
        if: ${{ !cancelled() }}
        run: cargo machete

  test:
    name: Test (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-nextest@0.9.133
      - name: Configure Windows temp directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testTmp = Join-Path $env:RUNNER_TEMP 'chokkin-test-tmp'
          New-Item -ItemType Directory -Force -Path $testTmp | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$testTmp"
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$testTmp"
          Add-Content -Path $env:GITHUB_ENV -Value "TMPDIR=$testTmp"
      - run: cargo nextest run --locked --all-targets
      - run: cargo test --locked --doc

  msrv:
    name: MSRV (1.96) + chokkin baseline
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable # zizmor: ignore[superfluous-actions] keep CI toolchain consistent
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # rust-cache skips saving on an exact key hit, so without a new key the
          # cache keeps only `cargo check` output and the baseline run rebuilds deps.
          key: baseline
      - name: cargo check (MSRV)
        run: cargo check --all-targets --locked
      # Dev profile: the findings do not depend on the profile, and the
      # release profile (thin LTO, codegen-units=1) is slow to rebuild each push.
      - name: Run chokkin with checked-in baseline
        if: ${{ !cancelled() }}
        run: cargo run --locked -- --baseline chokkin-baseline.json --reporter github
      - name: Write chokkin SARIF
        if: always()
        run: cargo run --locked -- --baseline chokkin-baseline.json --reporter sarif > chokkin.sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: chokkin-sarif
          path: chokkin.sarif
          retention-days: 14

  coverage:
    name: Coverage
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The old key holds tarpaulin's plain build. llvm-cov builds into
          # target/llvm-cov-target, and an exact key hit skips the save, so
          # without a new key the instrumented deps are rebuilt on every run.
          key: llvm-cov
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-llvm-cov@0.9.1
      # Source-based coverage runs the tests in parallel; tarpaulin's ptrace
      # engine needed --test-threads=1 and took ~4 min.
      # NOTE: --fail-under-lines omitted until analyzer implementation reaches coverage targets.
      # Re-enable at --fail-under-lines 95 for Phase 1 (v0.1 MVP). See docs/dev/ci-porting-notes.md.
      - run: cargo llvm-cov --locked --no-report
      - run: cargo llvm-cov report --summary-only
      - run: cargo llvm-cov report --html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: target/llvm-cov/html/
          retention-days: 14

  security:
    name: Security (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-deny@0.19.2
      - run: cargo deny check advisories licenses bans sources

  semver:
    name: Semver (PR only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-semver-checks@0.50.0
      # Compare against the last release tag, not main: breaking changes may
      # accumulate on main while the bumped version is still unreleased.
      - run: cargo semver-checks --baseline-rev "$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD)"

  repo-checks:
    name: Repo checks (actionlint, generated maps, action)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: bash <(curl -Ls https://raw.githubusercontent.com/rhysd/actionlint/393031adb9afb225ee52ae2ccd7a5af5525e03e8/scripts/download-actionlint.bash) 1.7.11
      - name: actionlint
        run: ./actionlint -color
      # generate-stdlib-modules.py reads sys.stdlib_module_names from each python3.X.
      # Patch versions are pinned: the list can change between patches (3.12.x added _wmi).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ !cancelled() }}
        with:
          python-version: |
            3.10.21
            3.11.16
            3.12.14
            3.13.15
            3.14.6
      - name: Check generated resolver maps
        if: ${{ !cancelled() }}
        run: make check-generated
      - name: Create action smoke-test fixture
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/demo/src/demo"
          printf '[project]\nname = "demo"\nversion = "0.0.0"\n' > "$RUNNER_TEMP/demo/pyproject.toml"
          echo 'VALUE = 1' > "$RUNNER_TEMP/demo/src/demo/__init__.py"
      - id: chokkin
        if: ${{ !cancelled() }}
        uses: ./
        with:
          # The default pins the next release, which may not be on PyPI yet.
          version: latest
          working-directory: ${{ runner.temp }}/demo
          sarif-file: out/chokkin.sarif
      - name: Check action SARIF output
        if: ${{ !cancelled() }}
        env:
          SARIF: ${{ steps.chokkin.outputs.sarif-file }}
        run: jq -e '.version == "2.1.0"' "$SARIF"

  zizmor:
    name: Zizmor
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.24.1
          persona: auditor

  semgrep:
    name: Semgrep
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install Semgrep
        run: pip install --no-cache-dir semgrep==1.166.0
      - name: Run Semgrep
        # Non-blocking: report findings to code scanning rather than failing the build.
        run: semgrep scan --config p/default --sarif --output semgrep.sarif
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep
