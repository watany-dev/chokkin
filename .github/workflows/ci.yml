name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily: catch newly published RustSec advisories without a code change,
    # and run the deep property-based tests (pbt-deep).
    - cron: "0 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Lint runs on the toolchain the wheels are built with, not on whatever
  # stable shipped that day: a new clippy lint otherwise breaks every open PR
  # the morning it lands (1.99's `assert_is_empty` did). Keep in sync with
  # RUST_TOOLCHAIN in release.yml; bump both in one `ci:` PR.
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  # Short checks share one job to save runner slots and setup time.
  # Each check step runs even if an earlier one failed (`!cancelled()`).
  lint:
    name: Lint (fmt, clippy, doc, machete)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-machete@0.9.2
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo doc
        if: ${{ !cancelled() }}
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked
      - name: cargo machete
        if: ${{ !cancelled() }}
        run: cargo machete

  test:
    name: Test (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # bash on every OS: Windows defaults to pwsh, which checks only the
      # exit code of the last command.
      - name: Install toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest@0.9.133
      - name: Configure Windows temp directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testTmp = Join-Path $env:RUNNER_TEMP 'chokkin-test-tmp'
          New-Item -ItemType Directory -Force -Path $testTmp | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$testTmp"
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$testTmp"
          Add-Content -Path $env:GITHUB_ENV -Value "TMPDIR=$testTmp"
      # No --all-targets: it adds --benches, which runs every criterion bench
      # once as a test (8-15 s each on Windows). The lint job's clippy
      # --all-targets keeps the benches compiling.
      - run: cargo nextest run --locked
      - run: cargo test --locked --doc

  msrv:
    name: MSRV (1.96) + chokkin baseline
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install 1.96 --profile minimal
          rustup default 1.96
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # rust-cache skips saving on an exact key hit, so without a new key the
          # cache keeps only `cargo check` output and the baseline run rebuilds deps.
          key: baseline
      - name: cargo check (MSRV)
        run: cargo check --all-targets --locked
      # Dev profile: the findings do not depend on the profile, and the
      # release profile (thin LTO, codegen-units=1) is slow to rebuild each push.
      - name: Run chokkin with checked-in baseline
        if: ${{ !cancelled() }}
        run: cargo run --locked -- --baseline chokkin-baseline.json --reporter github
      - name: Write chokkin SARIF
        if: always()
        run: cargo run --locked -- --baseline chokkin-baseline.json --reporter sarif > chokkin.sarif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: chokkin-sarif
          path: chokkin.sarif
          retention-days: 14

  # Determinism (cold / warm / --no-cache byte-identical), JSON schema and
  # crash gates over every in-repo fixture project and recall sentinel (#835).
  # The cargo tests run with --no-cache, so this is the only per-PR check
  # that a warm run returns what a cold run does. Needs no network or clones;
  # the full corpus runs in oss-metrics.yml.
  oss-gate:
    name: OSS gate (in-repo fixtures)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: python -m pip install jsonschema==4.26.0
      - name: Test the gate script
        run: python tests/test_oss_gate.py
      # Dev profile: the findings do not depend on the profile (see msrv).
      - name: Build chokkin
        run: cargo build --locked --bin chokkin
      - name: Gate
        run: |
          status=0
          python scripts/oss-gate.py --in-repo -b target/debug/chokkin || status=$?
          if [ -f target/oss-gate/report.md ]; then
            cat target/oss-gate/report.md >>"$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: oss-gate
          path: target/oss-gate
          retention-days: 14

  coverage:
    name: Coverage
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The old key holds tarpaulin's plain build. llvm-cov builds into
          # target/llvm-cov-target, and an exact key hit skips the save, so
          # without a new key the instrumented deps are rebuilt on every run.
          key: llvm-cov
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-llvm-cov@0.9.1
      # Source-based coverage runs the tests in parallel; tarpaulin's ptrace
      # engine needed --test-threads=1 and took ~4 min.
      # The line gate (95%, lines sit at ~98%) is on the summary step so the
      # HTML report is still produced and uploaded when it fails.
      - run: cargo llvm-cov --locked --no-report
      - run: cargo llvm-cov report --html
      - run: cargo llvm-cov report --summary-only --fail-under-lines 95
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: target/llvm-cov/html/
          retention-days: 14

  # Nightly: every proptest block at 16x its cases (`make pbt-deep`, #861).
  # A failure saves its seed to the regression files; the artifact carries
  # them so the seed can be committed with the fix.
  pbt-deep:
    name: PBT deep (nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: make pbt-deep
      - name: Collect new proptest seeds
        if: failure()
        run: |
          mkdir -p target/pbt-deep
          # Intent-to-add, so seed files proptest just created show in the diff.
          git add --intent-to-add -- '*.proptest-regressions' proptest-regressions
          git diff -- '*.proptest-regressions' proptest-regressions > target/pbt-deep/seeds.diff
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: pbt-deep-seeds
          path: target/pbt-deep
          retention-days: 14

  security:
    name: Security (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny@0.19.2
      - run: cargo deny check advisories licenses bans sources

  repo-checks:
    name: Repo checks (actionlint, generated maps)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: bash <(curl -Ls https://raw.githubusercontent.com/rhysd/actionlint/393031adb9afb225ee52ae2ccd7a5af5525e03e8/scripts/download-actionlint.bash) 1.7.11
      - name: actionlint
        run: ./actionlint -color
      # generate-stdlib-modules.py reads sys.stdlib_module_names from each python3.X.
      # Patch versions are pinned: the list can change between patches (3.12.x added _wmi).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ !cancelled() }}
        with:
          python-version: |
            3.10.21
            3.11.16
            3.12.14
            3.13.15
            3.14.6
      - name: Test scripts
        if: ${{ !cancelled() }}
        run: make test-scripts
      - name: Check generated resolver maps
        if: ${{ !cancelled() }}
        run: make check-generated

  zizmor:
    name: Zizmor
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.24.1
          persona: auditor

  semgrep:
    name: Semgrep
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Semgrep
        # Fail on findings; the always() upload below preserves the SARIF report
        # even when --error makes the scan exit 1. Keep the job name stable for
        # branch protection (see docs/dev/ci-porting-notes.md).
        # The image is pinned by digest (semgrep/semgrep:1.178.0); dependabot
        # does not track it, so bump the tag and digest together by hand.
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          semgrep/semgrep@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
          semgrep scan --config p/default --error --sarif --output semgrep.sarif
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
