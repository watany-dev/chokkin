name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  pull_request:
  workflow_dispatch:

# Serialize releases; do not cancel in-progress to protect partial uploads.
# PR runs never publish, so a newer push to the same PR supersedes them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned so a release is not built by whatever stable shipped that day.
  # Bump deliberately (see CONTRIBUTING.md "Release flow"); keep >= rust-version.
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  # ── Build wheels ──────────────────────────────────────────────────────────────
  build-wheels:
    name: Wheel (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: auto
          - runner: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            manylinux: auto
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
          - runner: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
          - runner: ubuntu-24.04
            target: i686-unknown-linux-gnu
            manylinux: auto
          - runner: ubuntu-24.04
            target: armv7-unknown-linux-gnueabihf
            manylinux: auto
          - runner: ubuntu-24.04
            target: powerpc64le-unknown-linux-gnu
            manylinux: auto
          - runner: ubuntu-24.04
            target: s390x-unknown-linux-gnu
            manylinux: auto
          - runner: ubuntu-24.04
            target: i686-unknown-linux-musl
            manylinux: musllinux_1_2
          - runner: ubuntu-24.04
            target: armv7-unknown-linux-musleabihf
            manylinux: musllinux_1_2
          - runner: macos-14
            target: x86_64-apple-darwin
            manylinux: ""
          - runner: macos-14
            target: aarch64-apple-darwin
            manylinux: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: ""
          - runner: windows-latest
            target: i686-pc-windows-msvc
            manylinux: ""
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            manylinux: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          # psm (via ruff_python_parser -> stacker) assembles `lay`, which the
          # manylinux2014 s390x cross gcc rejects at its default -march.
          CFLAGS_s390x_unknown_linux_gnu: -march=z10
        with:
          target: ${{ matrix.platform.target }}
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          # Pass manylinux only for Linux targets; empty string disables it for macOS/Windows.
          manylinux: ${{ matrix.platform.manylinux }}
          # Use the fat-LTO `dist` profile (Cargo.toml [profile.dist]) for the
          # smallest, most-optimized wheel binaries shipped to PyPI.
          args: --profile dist --locked --out dist
          # Caching is disabled on this publishing workflow: the wheels built
          # here are shipped to PyPI, so a poisoned build cache must not be able
          # to influence release artifacts (zizmor cache-poisoning, High).
          sccache: "false"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.platform.target }}
          path: dist/*.whl
          retention-days: 1

  # ── Build sdist ───────────────────────────────────────────────────────────────
  build-sdist:
    name: sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-sdist
          path: dist/*.tar.gz
          retention-days: 1

  # ── Test what ships (#834) ────────────────────────────────────────────────────
  # CI tests a dev build on the latest stable. These test the shipped
  # configuration instead, and the release jobs below need them, so a tag
  # whose wheels fail them publishes nothing.
  test-wheels:
    name: Test wheel (${{ matrix.target }})
    needs: [build-wheels]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Native runners where one exists; otherwise a container (musl, i686)
        # or QEMU (armv7, ppc64le, s390x). The images are pinned by digest
        # (python:3.13-slim and python:3.13-alpine, multi-arch); dependabot
        # does not track them, so bump the tag and digest together by hand.
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: i686-pc-windows-msvc
            runner: windows-latest
            python-arch: x86
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            python-arch: arm64
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            platform: linux/amd64
            image: python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            image: python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
          - target: i686-unknown-linux-gnu
            runner: ubuntu-24.04
            platform: linux/386
            image: python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f
          - target: i686-unknown-linux-musl
            runner: ubuntu-24.04
            platform: linux/386
            image: python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
          - target: armv7-unknown-linux-gnueabihf
            runner: ubuntu-24.04
            platform: linux/arm/v7
            image: python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f
            qemu: true
          - target: armv7-unknown-linux-musleabihf
            runner: ubuntu-24.04
            platform: linux/arm/v7
            image: python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
            qemu: true
          - target: powerpc64le-unknown-linux-gnu
            runner: ubuntu-24.04
            platform: linux/ppc64le
            image: python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f
            qemu: true
          - target: s390x-unknown-linux-gnu
            runner: ubuntu-24.04
            platform: linux/s390x
            image: python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f
            qemu: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-${{ matrix.target }}
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.image == ''
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python-arch }}
      - name: Smoke-test the wheel
        if: matrix.image == ''
        shell: bash
        run: python scripts/wheel-smoke.py dist/*.whl
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.qemu
      - name: Smoke-test the wheel in a container
        if: matrix.image != ''
        env:
          PLATFORM: ${{ matrix.platform }}
          IMAGE: ${{ matrix.image }}
        run: >-
          docker run --rm --platform "$PLATFORM" -v "$PWD:/src:ro" -w /src
          "$IMAGE" python3 scripts/wheel-smoke.py dist/*.whl

  # Where no wheel fits (FreeBSD, riscv64, old glibc, ...), `pip install chokkin`
  # builds the sdist with the user's toolchain and the release profile. Build
  # it with the oldest toolchain Cargo.toml allows, which nothing else builds
  # and runs (#846).
  test-sdist:
    name: Test sdist (source build, MSRV)
    needs: [build-sdist]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-sdist
          path: dist
      - name: Install the MSRV toolchain
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          rustup default "$msrv"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Smoke-test the sdist
        run: python scripts/wheel-smoke.py dist/*.tar.gz

  # The dist profile builds the binary with panic = "abort" and fat LTO, which
  # the integration tests then run; the in-process unit tests still unwind.
  test-dist:
    name: Test (dist profile, RUST_TOOLCHAIN)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the release toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - run: cargo "+$RUST_TOOLCHAIN" test --locked --profile dist

  # Runs the action on the x86_64 Linux wheel built from this commit, so a
  # change to action.yml is tested against the binary it will ship with.
  test-action:
    name: Test action (HEAD wheel)
    needs: [build-wheels]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/wheel
      - name: Create action smoke-test fixture
        id: fixture
        run: |
          mkdir -p "$RUNNER_TEMP/demo/src/demo"
          printf '[project]\nname = "demo"\nversion = "0.0.0"\n' > "$RUNNER_TEMP/demo/pyproject.toml"
          echo 'VALUE = 1' > "$RUNNER_TEMP/demo/src/demo/__init__.py"
          wheels=("$RUNNER_TEMP"/wheel/*.whl)
          echo "wheel=${wheels[0]}" >> "$GITHUB_OUTPUT"
      - id: chokkin
        uses: ./
        with:
          version: ${{ steps.fixture.outputs.wheel }}
          working-directory: ${{ runner.temp }}/demo
          sarif-file: out/chokkin.sarif
      - name: Check action SARIF output
        env:
          SARIF: ${{ steps.chokkin.outputs.sarif-file }}
        run: |
          jq -e '.version == "2.1.0"' "$SARIF"
          test ! -e "$RUNNER_TEMP/demo/.chokkin"

  # ── GitHub Release (tags only) ────────────────────────────────────────────────
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-wheels, build-sdist, test-wheels, test-sdist, test-dist, test-action]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write      # gh release create
      id-token: write      # OIDC for attestation
      attestations: write  # actions/attest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: sha256sum dist/* > dist/SHA256SUMS
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ./dist
          artifact-name: chokkin-sbom.spdx.json
          # Write into dist/ so it is included in the gh release create glob below.
          output-file: ./dist/chokkin-sbom.spdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "${TAG_NAME}" \
            --title "${TAG_NAME}" \
            --generate-notes \
            dist/*

  # ── Publish to PyPI (tags only) ───────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: [release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: pypi-chokkin
      url: https://pypi.org/p/chokkin
    permissions:
      id-token: write  # PyPI Trusted Publishing (no token needed)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      # PyPI Trusted Publishing requires the environment named "pypi-chokkin" to be
      # registered in pypi.org settings: repo=watany-dev/chokkin, workflow=release.yml.
      # See docs/dev/ci-porting-notes.md for setup instructions.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.1 (release/v1)
        with:
          packages-dir: dist/
