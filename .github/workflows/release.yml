name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
    # A PR skips the cross-compiled wheels unless it touches their build
    # inputs (scripts/ci-changes.py), so main builds and tests every target
    # after each merge, before a tag depends on them.
    branches: [main]
  pull_request:
  workflow_dispatch:

# Serialize releases; do not cancel in-progress to protect partial uploads.
# PR and main runs never publish, so a newer push to the same ref supersedes
# them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned so a release is not built by whatever stable shipped that day.
  # Bump deliberately (see CONTRIBUTING.md "Release flow"); keep >= rust-version.
  RUST_TOOLCHAIN: "1.98.1"
  # The tools that build and describe what ships, pinned for the same reason
  # (#1044). The actions pick maturin and syft at run time otherwise:
  # maturin-action the newest release that pyproject.toml's range allows, and
  # a bumped sbom-action SHA its own default syft. Dependabot does not track
  # them, so bump them by hand, like the Linux build containers below.
  MATURIN_VERSION: "v1.15.0"
  SYFT_VERSION: "v1.54.0"

jobs:
  # A PR that only edits prose skips the build and test jobs, as in ci.yml
  # (see the comment on its `changes` job). The matrix jobs skip their steps
  # instead, so `Wheel (<target>)` and `Test wheel (<target>)` still report.
  # A PR that does not touch the build inputs also skips the `-cross` jobs
  # (see build-wheels-cross). Pushes and manual runs build everything.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      cross: ${{ steps.diff.outputs.cross }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # HEAD is the PR merge commit; HEAD^1 is the base it was merged onto.
          fetch-depth: 2
      - id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD | python3 scripts/ci-changes.py >>"$GITHUB_OUTPUT"
          else
            printf 'code=true\ncross=true\n' >>"$GITHUB_OUTPUT"
          fi

  # ── Build wheels ──────────────────────────────────────────────────────────────
  build-wheels:
    name: Wheel (${{ matrix.platform.target }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    env: &build-env
      BUILD: ${{ needs.changes.outputs.code != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        # `container` pins the Linux build image by digest: the action's
        # default is a tag such as `manylinux2014_x86_64:latest`, so the image
        # a wheel is built in would otherwise change between runs (#1044). The
        # digests are the ones v0.7.9 was built with; bump the tag and digest
        # together by hand. Empty off Linux, where maturin builds on the runner.
        platform:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: auto
            container: quay.io/pypa/manylinux2014_x86_64:latest@sha256:ac38650bc13796f4a5858c1c46202bc163b7060f38629a50a0385522f193ce32
          - runner: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            manylinux: auto
            container: ghcr.io/rust-cross/manylinux2014-cross:aarch64@sha256:32c92568ebee8db53e0598c21bcd06a6dd1649d45d507646a8a49313c50325f8
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
            container: ghcr.io/rust-cross/rust-musl-cross:x86_64-musl@sha256:ce75e9174325d4fbb3de85c309e2d7ca29f7500169bc4b5d2c611ff7e86d549a
          - runner: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
            container: ghcr.io/rust-cross/rust-musl-cross:aarch64-musl@sha256:ecae5dd62d1c938c14f8071d36c16fa699860aace03bfb5284fb1216474d2643
          - runner: macos-14
            target: x86_64-apple-darwin
            manylinux: ""
          - runner: macos-14
            target: aarch64-apple-darwin
            manylinux: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: ""
          - runner: windows-latest
            target: i686-pc-windows-msvc
            manylinux: ""
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            manylinux: ""
    steps: &build-wheel-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.BUILD == 'true'
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        if: env.BUILD == 'true'
        env:
          # psm (via ruff_python_parser -> stacker) assembles `lay`, which the
          # manylinux2014 s390x cross gcc rejects at its default -march.
          CFLAGS_s390x_unknown_linux_gnu: -march=z10
        with:
          target: ${{ matrix.platform.target }}
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          maturin-version: ${{ env.MATURIN_VERSION }}
          # Pass manylinux only for Linux targets; empty string disables it for macOS/Windows.
          manylinux: ${{ matrix.platform.manylinux }}
          container: ${{ matrix.platform.container }}
          # Use the fat-LTO `dist` profile (Cargo.toml [profile.dist]) for the
          # smallest, most-optimized wheel binaries shipped to PyPI.
          args: --profile dist --locked --out dist
          # Caching is disabled on this publishing workflow: the wheels built
          # here are shipped to PyPI, so a poisoned build cache must not be able
          # to influence release artifacts (zizmor cache-poisoning, High).
          sccache: "false"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.BUILD == 'true'
        with:
          name: wheel-${{ matrix.platform.target }}
          path: dist/*.whl
          retention-days: 1

  # The targets that are cross-compiled and then tested under QEMU or a 32-bit
  # container. A PR builds them only when it changes their build inputs
  # (`cross` from scripts/ci-changes.py); the push to main after the merge
  # builds them every time. Skipped as a whole, so they are not created and
  # take no runner; they are not required checks for that reason.
  build-wheels-cross:
    name: Wheel (${{ matrix.platform.target }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.changes.outputs.cross != 'false' }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    env: *build-env
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-24.04
            target: i686-unknown-linux-gnu
            manylinux: auto
            container: quay.io/pypa/manylinux2014_i686:latest@sha256:06ddeb5288aec4cda672de6be8a28b9fb9a091fde44e97b9f2a5d3276bb8250e
          - runner: ubuntu-24.04
            target: armv7-unknown-linux-gnueabihf
            manylinux: auto
            container: ghcr.io/rust-cross/manylinux2014-cross:armv7@sha256:9bd3f47d894bf11bd00a114a79de07916d325802dca7a176e0a1f974ad5e7563
          - runner: ubuntu-24.04
            target: powerpc64le-unknown-linux-gnu
            manylinux: auto
            container: ghcr.io/rust-cross/manylinux2014-cross:ppc64le@sha256:6bc0da449a9890e705b10c88e056ea8e00eaf32ee512345a7156f92b379a3450
          - runner: ubuntu-24.04
            target: s390x-unknown-linux-gnu
            manylinux: auto
            container: ghcr.io/rust-cross/manylinux2014-cross:s390x@sha256:3a7baad42e2f88815bfba320e7d1713bb05a380683008da25eba07dfc8a50703
          - runner: ubuntu-24.04
            target: i686-unknown-linux-musl
            manylinux: musllinux_1_2
            container: ghcr.io/rust-cross/rust-musl-cross:i686-musl@sha256:e515546ceeb7fef8a70e7a59198981f5851cbcf16dd8d1adeb28736ea4751e05
          - runner: ubuntu-24.04
            target: armv7-unknown-linux-musleabihf
            manylinux: musllinux_1_2
            container: ghcr.io/rust-cross/rust-musl-cross:armv7-musleabihf@sha256:714d7529ed9098699cc13abade83c565e6a946e53975c108089a8cd3b43cb871
    steps: *build-wheel-steps

  # ── Build sdist ───────────────────────────────────────────────────────────────
  build-sdist:
    name: sdist
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
          maturin-version: ${{ env.MATURIN_VERSION }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-sdist
          path: dist/*.tar.gz
          retention-days: 1

  # ── Test what ships (#834) ────────────────────────────────────────────────────
  # CI tests a dev build on the latest stable. These test the shipped
  # configuration instead, and the release jobs below need them, so a tag
  # whose wheels fail them publishes nothing.
  test-wheels:
    name: Test wheel (${{ matrix.target }})
    needs: [changes, build-wheels]
    if: ${{ !cancelled() && needs.build-wheels.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env: *build-env
    strategy:
      fail-fast: false
      matrix:
        # Native runners where one exists; otherwise a container (musl). The
        # cross targets are in test-wheels-cross. The images are pinned by digest
        # (python:3.13-slim and python:3.13-alpine, multi-arch); dependabot
        # does not track them, so bump the tag and digest together by hand.
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: i686-pc-windows-msvc
            runner: windows-latest
            python-arch: x86
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            python-arch: arm64
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            platform: linux/amd64
            image: python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            image: python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.BUILD == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.BUILD == 'true'
        with:
          name: wheel-${{ matrix.target }}
          path: dist
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: env.BUILD == 'true' && matrix.image == ''
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python-arch }}
      - name: Smoke-test the wheel
        if: env.BUILD == 'true' && matrix.image == ''
        shell: bash
        run: python scripts/wheel-smoke.py dist/*.whl
      - name: Smoke-test the wheel in a container
        if: env.BUILD == 'true' && matrix.image != ''
        env:
          PLATFORM: ${{ matrix.platform }}
          IMAGE: ${{ matrix.image }}
        run: >-
          docker run --rm --platform "$PLATFORM" -v "$PWD:/src:ro" -w /src
          "$IMAGE" python3 scripts/wheel-smoke.py dist/*.whl

  test-wheels-cross:
    name: Test wheel (${{ matrix.target }})
    needs: [changes, build-wheels-cross]
    if: ${{ !cancelled() && needs.build-wheels-cross.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: i686-unknown-linux-gnu
            runner: ubuntu-24.04
            platform: linux/386
            image: python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f
          - target: i686-unknown-linux-musl
            runner: ubuntu-24.04
            platform: linux/386
            image: python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
          - target: armv7-unknown-linux-gnueabihf
            runner: ubuntu-24.04
            platform: linux/arm/v7
            image: python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f
            qemu: true
          - target: armv7-unknown-linux-musleabihf
            runner: ubuntu-24.04
            platform: linux/arm/v7
            image: python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
            qemu: true
          - target: powerpc64le-unknown-linux-gnu
            runner: ubuntu-24.04
            platform: linux/ppc64le
            image: python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f
            qemu: true
          - target: s390x-unknown-linux-gnu
            runner: ubuntu-24.04
            platform: linux/s390x
            image: python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f
            qemu: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-${{ matrix.target }}
          path: dist
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.qemu
      - name: Smoke-test the wheel in a container
        env:
          PLATFORM: ${{ matrix.platform }}
          IMAGE: ${{ matrix.image }}
        run: >-
          docker run --rm --platform "$PLATFORM" -v "$PWD:/src:ro" -w /src
          "$IMAGE" python3 scripts/wheel-smoke.py dist/*.whl

  # Where no wheel fits (FreeBSD, riscv64, old glibc, ...), `pip install chokkin`
  # builds the sdist with the user's toolchain and the release profile. Build
  # it with the oldest toolchain Cargo.toml allows, which nothing else builds
  # and runs (#846).
  test-sdist:
    name: Test sdist (source build, MSRV)
    needs: [changes, build-sdist]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.build-sdist.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-sdist
          path: dist
      - name: Install the MSRV toolchain
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          rustup default "$msrv"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Smoke-test the sdist
        run: python scripts/wheel-smoke.py dist/*.tar.gz

  # The dist profile builds the binary with panic = "abort" and fat LTO, which
  # the integration tests then run; the in-process unit tests still unwind.
  test-dist:
    name: Test (dist profile, RUST_TOOLCHAIN)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the release toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - run: cargo "+$RUST_TOOLCHAIN" test --locked --profile dist

  # Runs the action on the x86_64 Linux wheel built from this commit, so a
  # change to action.yml is tested against the binary it will ship with.
  test-action:
    name: Test action (HEAD wheel)
    needs: [changes, build-wheels]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.build-wheels.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/wheel
      - name: Create action smoke-test fixture
        id: fixture
        run: |
          mkdir -p "$RUNNER_TEMP/demo/src/demo"
          printf '[project]\nname = "demo"\nversion = "0.0.0"\n' > "$RUNNER_TEMP/demo/pyproject.toml"
          echo 'VALUE = 1' > "$RUNNER_TEMP/demo/src/demo/__init__.py"
          wheels=("$RUNNER_TEMP"/wheel/*.whl)
          echo "wheel=${wheels[0]}" >> "$GITHUB_OUTPUT"
      - id: chokkin
        uses: ./
        with:
          version: ${{ steps.fixture.outputs.wheel }}
          working-directory: ${{ runner.temp }}/demo
          sarif-file: out/chokkin.sarif
          # Flags the action also adds itself must not reach chokkin twice.
          args: --no-exit-code --reporter compact
      - name: Check action SARIF output
        env:
          SARIF: ${{ steps.chokkin.outputs.sarif-file }}
        run: |
          jq -e '.version == "2.1.0"' "$SARIF"
          test ! -e "$RUNNER_TEMP/demo/.chokkin"

  # ── Check the tag (tags only) ─────────────────────────────────────────────────
  # A tag publishes what it points at, to a GitHub Release and PyPI that cannot
  # be changed afterwards (#1043). So before the approval gate below, check that
  # it names the version being built and points at the release commit on main
  # (v0.7.4 was tagged at the tip of main instead, CONTRIBUTING.md "Release
  # flow"). Runs beside the builds, and fails in seconds.
  release-tag:
    name: Release tag
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # All branches, so origin/main is there to compare with.
          fetch-depth: 0
      - name: Check the tag names the release commit on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version() { sed -n 's/^version = "\(.*\)"$/\1/p'; }
          status=0
          for manifest in Cargo.toml pyproject.toml; do
            v=$(version <"$manifest")
            if [ "$TAG" != "v$v" ]; then
              echo "::error::tag $TAG does not match $manifest version '$v'"
              status=1
            fi
          done
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $TAG points at $GITHUB_SHA, which is not on main"
            status=1
          fi
          # The release commit is the one that sets the version; a later commit
          # on main has the same version but changes the CHANGELOG has not seen.
          v=$(version <Cargo.toml)
          if [ "$(git show "$GITHUB_SHA^:Cargo.toml" | version)" = "$v" ]; then
            echo "::error::$GITHUB_SHA is not the release commit: its parent already has version $v"
            status=1
          fi
          exit "$status"

  # ── GitHub Release (tags only) ────────────────────────────────────────────────
  # The attestation and the release are published for good, so this job waits
  # for the same approval as the PyPI upload (#1043): the pypi-chokkin
  # environment's required reviewer and `v*` tag policy. A release therefore
  # asks for two approvals, this one and publish-pypi's.
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - release-tag
      - build-wheels
      - build-wheels-cross
      - build-sdist
      - test-wheels
      - test-wheels-cross
      - test-sdist
      - test-dist
      - test-action
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: pypi-chokkin
    permissions:
      contents: write      # gh release create
      id-token: write      # OIDC for attestation
      attestations: write  # actions/attest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: sha256sum dist/* > dist/SHA256SUMS
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ./dist
          artifact-name: chokkin-sbom.spdx.json
          # Write into dist/ so it is included in the gh release create glob below.
          output-file: ./dist/chokkin-sbom.spdx.json
          syft-version: ${{ env.SYFT_VERSION }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "${TAG_NAME}" \
            --title "${TAG_NAME}" \
            --generate-notes \
            dist/*

  # ── Publish to PyPI (tags only) ───────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: [release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: pypi-chokkin
      url: https://pypi.org/p/chokkin
    permissions:
