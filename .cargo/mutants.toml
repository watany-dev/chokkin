# nextest runs each test in its own process, so a mutant's test run is as
# long as its slowest test rather than the sum (cargo test runs a binary's
# tests on threads, but the binaries one after another). nextest does not run
# doctests; the crate has none that execute (`src/lib.rs` only has a
# ```text block), so nothing is lost. CI's `test` job runs nextest too.
test_tool = "nextest"

# The auto timeout is 5x the baseline test time, and nextest shortens that
# baseline. A fixed floor keeps a slower runner, or a mutant that merely slows
# a test, from hitting the timeout instead of being judged by the tests (a
# timeout counts as caught, so a tight one hides a missed mutant).
minimum_test_timeout = 60

# Equivalent mutants: no test can tell them from the original. Match on the
# mutant description, not the line number, so edits elsewhere keep them aligned.
exclude_re = [
    # `#[cfg(kani)]` harnesses are never compiled by `cargo test`, so every
    # mutant in them is a guaranteed miss.
    "verification::",
    # Retrying every open error instead of only AlreadyExists still returns the
    # same error after 16 tries: only the retry count changes.
    "AlreadyExists with true in create_temp_in",
    # Walking every hinted directory instead of the name index gives the same
    # answer for a single-segment root, only slower (#1080).
    "replace match guard !root.contains\\('/'\\) with false in PytestImportPaths::provides_fallback",
    # The first statement line never starts with `#`, so no directive starts
    # exactly at `first_statement_offset`: `<` and `<=` agree.
    "replace < with <= in extract_ignores_with",
    # Parsing the held-back tests when they cannot count changes nothing: off
    # `--production` there are none, and an app with no members has no public
    # surface for them to vouch for. The guard only skips the parse.
    "replace && with \\|\\| in reads_production_tests",
    "replace reads_production_tests -> bool with true",
    # Each minor sets its own bit once, so `|` and `^` build the same set.
    "replace \\| with \\^ in branch_minors",
    # On POSIX `Path::is_absolute` is exactly the leading `/`, so requiring
    # both agrees there; the Windows-only test covers the drive form.
    "replace \\|\\| with && in is_absolute_path_str",
    # `resolve_baseline_path` has already refused every parent this check
    # would; it only guards a link swapped in between the two. The order is
    # pinned by `refused_baseline_write_creates_no_directory_outside_the_root`
    # (#1136).
    "replace ensure_parent_inside_root -> Result<\\(\\), BaselineError> with Ok\\(\\(\\)\\)",
    # The `#[cfg(all(test, windows))]` junction helper is not compiled where
    # cargo-mutants runs, so its mutants are guaranteed misses; the Windows
    # junction tests fail without it (#1136).
    "src/path_util.rs:.*: replace junction with \\(\\)",
    # One worker parsing on the scoped-thread path, or several in turn on the
    # sequential one, parse the same files; the caller reorders the results.
    "replace <= with > in run_parse_job",
    # Slot indexes are unique, so two failures never tie.
    "replace < with <= in earlier_failure",
    # A cache without the paths resolution built builds the same ones from
    # the same sources on first use: only the time changes (#1326).
    "replace RuleCache::with_pytest -> Self with Default::default\\(\\)",
    # The bundle size only picks how many threads decode it; any count
    # decodes the same lines in order (#1328).
    "replace / with (\\*|%) in ParseCacheBundle::decode",
    # `no:name` is no dotted name, so `push_plugin_module` drops it too: the
    # guard only says why (#1353).
    "replace match guard module.starts_with\\(\"no:\"\\) with false in push_addopts",
    # Parsing a member the root takes from the index too only adds imports
    # the used check drops: it reads a member's own imports only when the
    # root ships its tree (#1342). The guard only skips the parse.
    "replace is_local_source_member -> bool with true",
    # Tracking a receiver only skips evaluating it: an untracked root
    # evaluates to itself when an import binds it and to nothing otherwise,
    # which no import reads either way (#1427).
    "replace && with \\|\\| in ModuleVisitor<'a, 'ast>::receiver_site",
    "replace ModuleVisitor<'a, 'ast>::reads_store -> bool with true",
    # With no string constant there is nothing for the binding count to drop:
    # the guard only skips counting.
    "delete ! in string_constants",
    # Dropping aliases from an empty map changes nothing: the guard only
    # skips the walk over the targets.
    "delete ! in ModuleVisitor<'a, 'ast>::bind_values",
    # Keeping a value no definition or import roots only keeps a name no
    # module resolves: the filter only trims what is carried (#1427).
    "replace ModuleVisitor<'a, 'ast>::may_hold_module -> bool with true",
    # Counting a from import's package as bound, or every receiver as
    # reaching a module, only lets more expressions past the pre-check: what
    # they evaluate to resolves the same way (#1427).
    "replace == with != in ModuleVisitor<'a, 'ast>::import_root",
    "replace ModuleVisitor<'a, 'ast>::may_reach_module -> bool with true",
    # A name star imports reach by several paths fails the same way on each:
    # visiting it again only spends the lookup budget.
    "replace Lookups::first_visit -> bool with true",
]
