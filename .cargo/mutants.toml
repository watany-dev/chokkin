# nextest runs each test in its own process, so a mutant's test run is as
# long as its slowest test rather than the sum (cargo test runs a binary's
# tests on threads, but the binaries one after another). nextest does not run
# doctests; the crate has none that execute (`src/lib.rs` only has a
# ```text block), so nothing is lost. CI's `test` job runs nextest too.
test_tool = "nextest"

# The auto timeout is 5x the baseline test time, and nextest shortens that
# baseline. A fixed floor keeps a slower runner, or a mutant that merely slows
# a test, from hitting the timeout instead of being judged by the tests (a
# timeout counts as caught, so a tight one hides a missed mutant).
minimum_test_timeout = 60

# Equivalent mutants: no test can tell them from the original. Match on the
# mutant description, not the line number, so edits elsewhere keep them aligned.
exclude_re = [
    # `#[cfg(kani)]` harnesses are never compiled by `cargo test`, so every
    # mutant in them is a guaranteed miss.
    "verification::",
    # Retrying every open error instead of only AlreadyExists still returns the
    # same error after 16 tries: only the retry count changes.
    "AlreadyExists with true in create_temp_in",
    # Walking every hinted directory instead of the name index gives the same
    # answer for a single-segment root, only slower (#1080).
    "replace match guard !root.contains\\('/'\\) with false in PytestImportPaths::provides_fallback",
    # The first statement line never starts with `#`, so no directive starts
    # exactly at `first_statement_offset`: `<` and `<=` agree.
    "replace < with <= in extract_ignores_with",
    # Parsing the held-back tests when they cannot count changes nothing: off
    # `--production` there are none, and an app with no members has no public
    # surface for them to vouch for. The guard only skips the parse.
    "replace && with \\|\\| in reads_production_tests",
    "replace reads_production_tests -> bool with true",
    # Off Windows every absolute path starts with `/`, so `is_absolute() && /`
    # still answers the same; `windows_drive_path_is_rejected` catches it on
    # the Windows CI job (#1136). The column keeps the second `||` in, which
    # `absolute_posix_path_is_rejected` catches.
    ":35: replace \\|\\| with && in is_absolute_path_str",
    # `resolve_baseline_path` has already refused every parent this check
    # would; it only guards a link swapped in between the two. The order is
    # pinned by `refused_baseline_write_creates_no_directory_outside_the_root`
    # (#1136).
    "replace ensure_parent_inside_root -> Result<\\(\\), BaselineError> with Ok\\(\\(\\)\\)",
]
