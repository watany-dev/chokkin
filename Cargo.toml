[package]
name = "chokkin"
version = "0.7.1"
edition = "2024"
rust-version = "1.96"
description = "Find unused files, dependencies, and public symbols in Python projects"
readme = "README.md"
license = "MIT"
repository = "https://github.com/watany-dev/chokkin"
homepage = "https://github.com/watany-dev/chokkin"
keywords = ["python", "dead-code", "dependencies", "unused", "knip"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# Minimal features: help/version output is hand-rolled in main.rs (USAGE), so
# clap only needs parsing + error rendering; dropping the default
# color/suggestions/help features shrinks the binary.
clap = { version = "4", default-features = false, features = [
  "std",
  "derive",
  "usage",
  "error-context",
] }
globset = "0.4"
ignore = "0.4"
indexmap = "2"
memchr = "2"
regex = "1"
# ruff crates break on every 0.0.x release: exact pins, bumped in lockstep (ADR 0001).
ruff_python_ast = "=0.0.15"
ruff_python_parser = "=0.0.15"
ruff_text_size = "=0.0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.1"
toml_edit = "0.25"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# Local schema tests only; skip resolve-http so reqwest/h2/rustls stay out of
# the tree (RUSTSEC-2026-0258 / RUSTSEC-2026-0285).
jsonschema = { version = "0.58", default-features = false }
proptest = "1"
tempfile = "3"

# Route `cargo bench` to the criterion targets only; the default libtest
# harness rejects criterion CLI flags such as --save-baseline.
[lib]
bench = false

[[bin]]
name = "chokkin"
path = "src/main.rs"
bench = false

[[bench]]
name = "manifest"
harness = false

[[bench]]
name = "sources"
harness = false

[[bench]]
name = "cache"
harness = false

[lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "deny"
unused_must_use = "deny"
# Crate-internal items stay `pub(crate)` so `dead_code` catches unused ones;
# the CLI is the product, the library API is not a contract (ADR 0004).
unreachable_pub = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
trivial_numeric_casts = "warn"
variant_size_differences = "warn"
noop_method_call = "warn"
meta_variable_misuse = "warn"
# kani proof harnesses (`make kani`).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
# Groups as a strict baseline; CI runs clippy with -D warnings.
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Contradicts rustc `unreachable_pub` (see [lints.rust]).
redundant_pub_crate = "allow"

# Restrictions: never in production code (relaxed for tests via clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
mem_forget = "deny"
unreachable = "deny"
lossy_float_literal = "deny"
rc_buffer = "deny"
verbose_file_reads = "deny"
assertions_on_result_states = "deny"
empty_drop = "deny"
empty_structs_with_brackets = "deny"
partial_pub_fields = "deny"
pub_without_shorthand = "deny"
redundant_type_annotations = "deny"
same_name_method = "deny"
try_err = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
unnecessary_self_imports = "deny"
unneeded_field_pattern = "deny"
self_named_module_files = "deny"
semicolon_inside_block = "deny"
# Integration tests and property-test macros need root-level #[test].
tests_outside_test_module = "allow"

# Duplicate crate versions are enforced by cargo-deny (deny.toml [bans]), not clippy.
multiple_crate_versions = "allow"

# Exemptions for legitimate patterns.
module_name_repetitions = "allow"
option_if_let_else = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_const_for_fn = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = false

# Used by wheel/release builds for maximum optimization.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
# Size-optimize the wheel binary except the parsing hot path below: measured
# ~15% smaller (6.25 MB -> 5.28 MB) for ~6% slower cold analysis, well within
# the §17 "medium project cold run <= 2 s" budget. `release` stays opt-level 3
# so benchmarks keep tracking full-speed codegen.
opt-level = "s"

[profile.dev]
opt-level = 0
panic = "unwind"

# Benchmarks: keep release optimization but retain symbols for profilers.
[profile.bench]
inherits = "release"
debug = "line-tables-only"
strip = "none"

[profile.dev.package."*"]
opt-level = 1

[[bench]]
name = "resolver"
harness = false

[[bench]]
name = "pipeline"
harness = false
