name: chokkin
description: Report unused files, dependencies, and symbols in a Python project.
author: watany-dev
branding:
  icon: scissors
  color: green

inputs:
  version:
    description: chokkin version to run from PyPI (e.g. "0.6.0"), "latest", or the path of a chokkin wheel (*.whl, relative to working-directory).
    required: false
    # Bumped together with Cargo.toml / pyproject.toml on each release.
    default: "0.7.10"
  working-directory:
    description: Project root to analyze.
    required: false
    default: "."
  baseline:
    description: Baseline file path (relative to working-directory). Only findings not in the baseline fail the job.
    required: false
    default: ""
  reporter:
    description: Reporter for the gating run (default, compact, json, markdown, github, sarif).
    required: false
    default: github
  sarif-file:
    description: If set, also write a SARIF report to this path (relative to working-directory) for code scanning upload.
    required: false
    default: ""
  args:
    description: Extra CLI arguments, whitespace-separated (e.g. "--production --confidence likely"). A --reporter, --baseline or --no-cache here replaces the one from the inputs; the SARIF run ignores --reporter and --no-exit-code.
    required: false
    default: ""
  cache:
    description: Set to "true" to read and write chokkin's .chokkin/ cache. Off by default so cache files committed in a pull request cannot change the result.
    required: false
    default: "false"

outputs:
  sarif-file:
    description: Absolute path of the SARIF report, when sarif-file is set.
    value: ${{ steps.sarif.outputs.path }}

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

    # Runs before the gating step so the report exists even when that step fails.
    - id: sarif
      if: inputs.sarif-file != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CHOKKIN_VERSION: ${{ inputs.version }}
        CHOKKIN_BASELINE: ${{ inputs.baseline }}
        CHOKKIN_SARIF: ${{ inputs.sarif-file }}
        CHOKKIN_ARGS: ${{ inputs.args }}
        CHOKKIN_CACHE: ${{ inputs.cache }}
      run: |
        set -euo pipefail -f
        case "$CHOKKIN_VERSION" in
          latest) spec=(chokkin) ;;
          *.whl) spec=(--from "$CHOKKIN_VERSION" chokkin) ;;
          *) spec=("chokkin@$CHOKKIN_VERSION") ;;
        esac
        # A repeated flag is a usage error. This run needs its own reporter and
        # exit code, so those are dropped from args; a --baseline or --no-cache
        # in args replaces the one the inputs would add.
        args=() skip=false has_baseline=false has_no_cache=false
        for arg in $CHOKKIN_ARGS; do
          if $skip; then skip=false; continue; fi
          case "$arg" in
            --no-exit-code | --reporter=*) continue ;;
            --reporter) skip=true; continue ;;
            --baseline | --baseline=*) has_baseline=true ;;
            --no-cache) has_no_cache=true ;;
          esac
          args+=("$arg")
        done
        cmd=(uvx "${spec[@]}" --no-exit-code --reporter sarif)
        [ -z "$CHOKKIN_BASELINE" ] || $has_baseline || cmd+=(--baseline "$CHOKKIN_BASELINE")
        [ "$CHOKKIN_CACHE" = true ] || $has_no_cache || cmd+=(--no-cache)
        cmd+=("${args[@]}")
        mkdir -p "$(dirname "$CHOKKIN_SARIF")"
        "${cmd[@]}" > "$CHOKKIN_SARIF"
        echo "path=$(cd "$(dirname "$CHOKKIN_SARIF")" && pwd)/$(basename "$CHOKKIN_SARIF")" >> "$GITHUB_OUTPUT"

    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CHOKKIN_VERSION: ${{ inputs.version }}
        CHOKKIN_BASELINE: ${{ inputs.baseline }}
        CHOKKIN_REPORTER: ${{ inputs.reporter }}
        CHOKKIN_ARGS: ${{ inputs.args }}
        CHOKKIN_CACHE: ${{ inputs.cache }}
      run: |
        set -euo pipefail -f
        case "$CHOKKIN_VERSION" in
          latest) spec=(chokkin) ;;
          *.whl) spec=(--from "$CHOKKIN_VERSION" chokkin) ;;
          *) spec=("chokkin@$CHOKKIN_VERSION") ;;
        esac
        # A repeated flag is a usage error, so a --reporter, --baseline or
        # --no-cache in args replaces the one the inputs would add.
        args=() has_reporter=false has_baseline=false has_no_cache=false
        for arg in $CHOKKIN_ARGS; do
          case "$arg" in
            --reporter | --reporter=*) has_reporter=true ;;
            --baseline | --baseline=*) has_baseline=true ;;
            --no-cache) has_no_cache=true ;;
          esac
          args+=("$arg")
        done
        cmd=(uvx "${spec[@]}")
        $has_reporter || cmd+=(--reporter "$CHOKKIN_REPORTER")
        [ -z "$CHOKKIN_BASELINE" ] || $has_baseline || cmd+=(--baseline "$CHOKKIN_BASELINE")
        [ "$CHOKKIN_CACHE" = true ] || $has_no_cache || cmd+=(--no-cache)
        cmd+=("${args[@]}")
        "${cmd[@]}"
